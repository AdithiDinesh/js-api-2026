<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
</head>
<body>
    <div align="center">
        <h1>Random User Generator</h1>
        <input type="number" id="userCount" placeholder="Enter number of users"
            style="padding: 10px; border: 2px solid rgb(95, 95, 244); border-radius: 5px;">
        <button onclick="fetchUserData()"
            style="background-color: blue; color: white; border: none; padding: 10px 20px; border-radius: 5px;">
            Generate Users
        </button>
        <div id="userContainer"></div>
    </div>
    <script>

        async function fetchUserData() {
            try {
                const count = document.getElementById("userCount").value;
                if (count === "" || count < 1) {
                    alert("Please enter a valid number");
                    return;
                }
                const response = await fetch(`https://randomuser.me/api/?results=${count}`);
                console.log(response);
                const userdata = await response.json();
                console.log(userdata);
                const users = userdata.results;
                userContainer.innerHTML = "";
                users.forEach(user => {
                    userContainer.innerHTML += `
                        <div>
                            <img src="${user.picture.large}" width="150" height="150">
                            <h2>${user.name.first} ${user.name.last}</h2>
                            <p>Email: ${user.email}</p>
                            <p>Location: ${user.location.city}, ${user.location.country}</p>
                            <p>Phone: ${user.phone}</p>
                         <hr>
                        </div>
                    `;
                });
            }
             catch (error) {
                console.log(error);
                   }
                    }
    </script>
</body>
</html>
